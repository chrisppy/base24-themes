<text x="40" y="480" font-size="14" xml:space="preserve"><tspan fill="#9b4a2e">        raise </tspan><tspan fill="#7a611d">ValueError</tspan><tspan fill="#26231f">(</tspan><tspan fill="#3b7048">&quot;no lineup\n&quot;</tspan><tspan fill="#26231f">)</tspan></text>
<text x="40" y="502" font-size="14" xml:space="preserve"><tspan fill="#9b4a2e">    return </tspan><tspan fill="#7a611d">Game</tspan><tspan fill="#26231f">(home=</tspan><tspan fill="#3b7048">&quot;Orioles&quot;</tspan><tspan fill="#26231f">, innings=</tspan><tspan fill="#9a5000">9</tspan><tspan fill="#26231f"> + </tspan><tspan fill="#b83c00">inning</tspan><tspan fill="#26231f">)</tspan></text>
