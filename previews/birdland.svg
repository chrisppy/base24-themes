<text x="40" y="436" font-size="14" xml:space="preserve"><tspan fill="#b8683f">def </tspan><tspan fill="#d98b45">first_pitch</tspan><tspan fill="#e5dfd2">(</tspan><tspan fill="#df4601">team</tspan><tspan fill="#e5dfd2">: </tspan><tspan fill="#d4ad4c">str</tspan><tspan fill="#e5dfd2">, </tspan><tspan fill="#df4601">inning</tspan><tspan fill="#e5dfd2">: </tspan><tspan fill="#d4ad4c">int</tspan><tspan fill="#e5dfd2"> = </tspan><tspan fill="#ff7a1a">1</tspan><tspan fill="#e5dfd2">) -&gt; </tspan><tspan fill="#d4ad4c">Game</tspan><tspan fill="#e5dfd2">:</tspan></text>
