<text x="16" y="30" font-size="11" xml:space="preserve"><tspan fill="#464646"># Oriole Park at Camden Yards</tspan></text>
<text x="16" y="47" font-size="11" xml:space="preserve"><tspan fill="#b8683f">def </tspan><tspan fill="#d98b45">first_pitch</tspan><tspan fill="#e5dfd2">(</tspan><tspan fill="#df4601">team</tspan><tspan fill="#e5dfd2">: </tspan><tspan fill="#d4ad4c">str</tspan><tspan fill="#e5dfd2">, </tspan><tspan fill="#df4601">inning</tspan><tspan fill="#e5dfd2">: </tspan><tspan fill="#d4ad4c">int</tspan><tspan fill="#e5dfd2"> = </tspan><tspan fill="#ff7a1a">1</tspan><tspan fill="#e5dfd2">) -&gt; </tspan><tspan fill="#d4ad4c">Game</tspan><tspan fill="#e5dfd2">:</tspan></text>
<text x="16" y="64" font-size="11" xml:space="preserve"><tspan fill="#b8683f">    if not </tspan><tspan fill="#df4601">team</tspan><tspan fill="#e5dfd2">:</tspan></text>
<text x="16" y="81" font-size="11" xml:space="preserve"><tspan fill="#b8683f">        raise </tspan><tspan fill="#d4ad4c">ValueError</tspan><tspan fill="#e5dfd2">(</tspan><tspan fill="#4f8f6a">&quot;no lineup\n&quot;</tspan><tspan fill="#e5dfd2">)</tspan></text>
<text x="16" y="98" font-size="11" xml:space="preserve"><tspan fill="#b8683f">    return </tspan><tspan fill="#d4ad4c">Game</tspan><tspan fill="#e5dfd2">(home=</tspan><tspan fill="#4f8f6a">&quot;Orioles&quot;</tspan><tspan fill="#e5dfd2">, innings=</tspan><tspan fill="#ff7a1a">9</tspan><tspan fill="#e5dfd2"> + </tspan><tspan fill="#df4601">inning</tspan><tspan fill="#e5dfd2">)</tspan></text>
