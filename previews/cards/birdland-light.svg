<text x="16" y="47" font-size="11" xml:space="preserve"><tspan fill="#9b4a2e">def </tspan><tspan fill="#7f5530">first_pitch</tspan><tspan fill="#26231f">(</tspan><tspan fill="#b83c00">team</tspan><tspan fill="#26231f">: </tspan><tspan fill="#7a611d">str</tspan><tspan fill="#26231f">, </tspan><tspan fill="#b83c00">inning</tspan><tspan fill="#26231f">: </tspan><tspan fill="#7a611d">int</tspan><tspan fill="#26231f"> = </tspan><tspan fill="#9a5000">1</tspan><tspan fill="#26231f">) -&gt; </tspan><tspan fill="#7a611d">Game</tspan><tspan fill="#26231f">:</tspan></text>
<text x="16" y="64" font-size="11" xml:space="preserve"><tspan fill="#9b4a2e">    if not </tspan><tspan fill="#b83c00">team</tspan><tspan fill="#26231f">:</tspan></text>
<text x="16" y="81" font-size="11" xml:space="preserve"><tspan fill="#9b4a2e">        raise </tspan><tspan fill="#7a611d">ValueError</tspan><tspan fill="#26231f">(</tspan><tspan fill="#3b7048">&quot;no lineup\n&quot;</tspan><tspan fill="#26231f">)</tspan></text>
<text x="16" y="98" font-size="11" xml:space="preserve"><tspan fill="#9b4a2e">    return </tspan><tspan fill="#7a611d">Game</tspan><tspan fill="#26231f">(home=</tspan><tspan fill="#3b7048">&quot;Orioles&quot;</tspan><tspan fill="#26231f">, innings=</tspan><tspan fill="#9a5000">9</tspan><tspan fill="#26231f"> + </tspan><tspan fill="#b83c00">inning</tspan><tspan fill="#26231f">)</tspan></text>
